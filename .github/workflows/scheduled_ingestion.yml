name: SkyFare India - 4x Daily Automated Flight Ingestion & Index Pipeline

on:
  schedule:
    # 4x Daily Multi-Horizon Ingestion across all 14 DGCA Corridors (T+1, T+7, T+15, T+30, T+45):
    # Scheduled with non-standard minutes (:20, :40) to evade GitHub Actions runner queue congestion.
    # Spaced ~5.5 to 6 hours apart, absorbing up to 3 hours of runner delay while guaranteeing >=3 daily scans.
    # Shift 1: Morning Early Bird  (00:20 UTC = 05:50 AM IST) -> Scrapling: All 5, SerpApi: T+1, T+7
    - cron: '20 0 * * *'
    # Shift 2: Midday Market       (05:40 UTC = 11:10 AM IST) -> Scrapling: All 5, SerpApi: T+1, T+7
    - cron: '40 5 * * *'
    # Shift 3: Evening Surge       (11:20 UTC = 04:50 PM IST) -> Scrapling: All 5, SerpApi: T+1, T+7
    - cron: '20 11 * * *'
    # Shift 4: Night Final & EOD   (16:40 UTC = 10:10 PM IST) -> Scrapling: All 5, SerpApi: All 5 + Fisher EOD Index
    - cron: '40 16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: skyfare-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: 4x Daily Automated Airfare Harvesting & Surveillance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Ingestion Dependencies & Scrapling Stealth Engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scrapling curl_cffi psycopg2-binary supabase

      - name: Execute SkyFare Ingestion Engine (Tiered Horizons by Shift)
        env:
          # Cloud Database (Supabase PostgreSQL) or local fallback
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scrapling Multi-Source Engine & SerpApi fallback
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SCRAPLING_ENGINE_ENABLED: "true"
          SKYFARE_BATCH_DELAY_SECONDS: "1.5"
        run: |
          python batch_fetch_real_data.py --shift auto --engine dual
