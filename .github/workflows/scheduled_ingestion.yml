name: SkyFare India - 3x Daily Automated Flight Ingestion & Index Pipeline

on:
  schedule:
    # 3x Daily Multi-Horizon Ingestion across all 14 DGCA Corridors (T+1, T+7, T+15, T+30, T+45):
    # 05:15 UTC = 10:45 AM IST (Morning Shift - avoids :00 top-of-hour queue throttling)
    - cron: '15 5 * * *'
    # 10:15 UTC = 03:45 PM IST (Afternoon Shift)
    - cron: '15 10 * * *'
    # 17:15 UTC = 10:45 PM IST (Night Shift & EOD Fisher Ideal National Index Calculation)
    - cron: '15 17 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: skyfare-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: 3x Daily Automated Airfare Harvesting & Surveillance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Ingestion Dependencies & Scrapling Stealth Engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scrapling curl_cffi psycopg2-binary supabase

      - name: Execute SkyFare Ingestion Engine (All Horizons T+1 to T+45)
        env:
          # Cloud Database (Supabase PostgreSQL) or local fallback
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scrapling Multi-Source Engine & SerpApi fallback
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SCRAPLING_ENGINE_ENABLED: "true"
          SKYFARE_BATCH_DELAY_SECONDS: "1.5"
        run: |
          python batch_fetch_real_data.py --shift all --engine dual
